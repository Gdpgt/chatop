spring.application.name=backend

spring.config.import=optional:file:./env.properties,optional:file:../env.properties

logging.level.com.chatop.backend=INFO

server.port=3001

# Disable Open Session In View: lazy loading must be resolved in the service layer
spring.jpa.open-in-view=false

spring.datasource.url=jdbc:mysql://localhost:3306/chatop_db
spring.datasource.username=chatop
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=10MB
