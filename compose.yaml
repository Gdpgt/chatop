services:
  mysql:
    image: mysql:8.4
    container_name: chatop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chatop_db
      MYSQL_USER: chatop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ressources/sql/00-grants.sql:/docker-entrypoint-initdb.d/00-grants.sql:ro
      - ./ressources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mysql-data:
